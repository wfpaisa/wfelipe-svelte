<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			try {
				const saved = localStorage.getItem('theme');
				document.documentElement.dataset.theme =
					saved === 'dark' || saved === 'light'
						? saved
						: matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light';
			} catch {}
			// The headline is drawn in particles once the fonts load; until then its solid text stays hidden.
			document.documentElement.classList.add('headline-pending');
			setTimeout(() => document.documentElement.classList.remove('headline-pending'), 3000);
			try {
				if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
					document.documentElement.classList.add('story-pending');
					setTimeout(() => document.documentElement.classList.remove('story-pending'), 4000);
				}
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
